name: Deploy Mise MCP Worker

on:
  push:
    branches: [main]
    paths:
      - "mise-mcp/**"
      - "mcp-worker/src/firestore.ts"
      - "src/types.ts"
      - "src/utils/**"
      - ".github/workflows/deploy-mise-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: mise-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mise-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mise-mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      # The tests run from the repo root (they import the app's code).
      - name: Test
        working-directory: .
        run: npm ci && npx vitest run mise-mcp/test

      # Until the Cloudflare secrets are added, stop here rather than fail.
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The OAuth KV namespace: created on the first deploy, found by name after that.
      - name: Find or create the OAuth KV namespace
        if: steps.creds.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler kv namespace list 2>/dev/null | jq -r '.[] | select(.title=="mise-mcp-oauth") | .id'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler kv namespace create mise-mcp-oauth
            id=$(find_id)
          fi
          test -n "$id"
          sed -i "s/<Add-KV-ID>/$id/" wrangler.jsonc

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          # Already in this repo for the Pages build.
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          args=(--var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID" --var "FIREBASE_API_KEY:$FIREBASE_API_KEY")
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            jq -n --arg sa "$FIREBASE_SERVICE_ACCOUNT" '{FIREBASE_SERVICE_ACCOUNT: $sa}' > "$RUNNER_TEMP/secrets.json"
            args+=(--secrets-file "$RUNNER_TEMP/secrets.json")
          fi
          npx wrangler deploy "${args[@]}"
